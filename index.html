const DEF_SEC = {"协助调查通知依据":["行政处罚法第54条","行政处罚法第55条"]};
let CSV_DATA = [], currentRaw = "";

// ================= 逻辑区 =================
window.onload = function() {
    const s = document.getElementById('situationSelect');
    for(const k in SIT) { let o = document.createElement('option'); o.value=k; o.text=k+" | "+SIT[k].n.substring(0,15)+"..."; s.appendChild(o); }
    // 加上时间戳绕过浏览器强制缓存
    fetch('laws.csv?t=' + new Date().getTime())
        .then(r => r.ok ? r.text() : Promise.reject('未找到laws.csv，请确认已上传到仓库根目录'))
        .then(t => { 
            parseCSV(t); 
            updateResult(`✅ 初始化完成！已加载 ${Object.keys(SIT).length} 项完整情形，${CSV_DATA.length} 条CSV政策数据。\n如果CSV显示0条，请确认 laws.csv 是否已上传。`); 
        })
        .catch(e => updateResult(`⚠️ 加载完成，但 CSV 读取失败：${e}\n你仍可使用内置法条查询。`));
};

// 【核心修复】状态机解析 CSV，完美处理带引号、逗号和换行符的复杂内容
function parseCSV(text) {
    let result = [];
    let row = [];
    let current = '';
    let inQuotes = false;

    for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (inQuotes) {
            if (char === '"') {
                if (nextChar === '"') { current += '"'; i++; } 
                else { inQuotes = false; }
            } else { current += char; }
        } else {
            if (char === '"') { inQuotes = true; }
            else if (char === ',') { row.push(current); current = ''; }
            else if (char === '\n' || char === '\r') {
                row.push(current); current = '';
                if (row.length > 1 || row[0] !== '') result.push(row);
                row = [];
                if (char === '\r' && nextChar === '\n') i++;
            } else { current += char; }
        }
    }
    if (current !== '' || row.length > 0) { row.push(current); result.push(row); }
    if (result.length < 2) return;

    const headers = result[0].map(h => h.trim().replace(/[\r\n]/g, ''));
    const iN = headers.findIndex(h => h.includes('名称'));
    const iB = headers.findIndex(h => h.includes('正文') || h.includes('内容'));
    const iU = headers.findIndex(h => h.includes('网址'));
    const iM = headers.findIndex(h => h.includes('文号'));
    const iD = headers.findIndex(h => h.includes('发布日期'));
    const iI = headers.findIndex(h => h.includes('序号'));

    for (let i = 1; i < result.length; i++) {
        const cols = result[i];
        if (!cols || cols.length === 0) continue;
        const body = iB >= 0 ? cols[iB] : '';
        if (!body) continue;
        
        CSV_DATA.push({
            id: iI >= 0 ? cols[iI] : '',
            name: iN >= 0 ? cols[iN] : '',
            body: body.replace(/<[^>]+>/g, '').trim(),
            url: iU >= 0 ? cols[iU] : '',
            no: iM >= 0 ? cols[iM] : '',
            date: iD >= 0 ? cols[iD] : ''
        });
    }
}

function getP(k){ return LP[k] || {l:k, a:"", c:"（该法规原文未内置，请使用上方搜索框检索政策库）"}; }

function querySituation() {
    const k = document.getElementById('situationSelect').value; if(!k) return updateResult("请选择执法事项");
    const s = SIT[k]; let txt = `【情形编号】${k}\n【情形名称】${s.n}\n【所属分类】${s.t}\n【过渡期建议】${s.tr}\n\n`;
    
    if(s.es.a){ txt+="【公告调查依据】\n"; s.es.a.forEach(x=>{ if(x.startsWith("（")) txt+=`  ${x}\n`; else { let p=getP(x); txt+=`  · ${p.l}${p.a}：${p.c}\n`; }}); txt+="\n"; }
    
    txt+="【协助调查通知依据】\n"; DEF_SEC["协助调查通知依据"].forEach(x=>{ let p=getP(x); txt+=`  · ${p.l}${p.a}：${p.c}\n`; }); txt+="\n";
    
    txt+="【处罚理由】\n"; s.ls.r.forEach(x=>{ if(x.startsWith("（")) txt+=`  ${x}\n`; else { let p=getP(x); txt+=`  · ${p.l}${p.a}：${p.c}\n`; }}); txt+="\n";
    
    txt+="【处罚依据】\n"; s.ls.p.forEach(x=>{ let p=getP(x); txt+=`  · ${p.l}${p.a}：${p.c}\n`; }); txt+="\n";
    
    if(s.es.m){ txt+="【移送依据】\n"; s.es.m.forEach(x=>{ let p=getP(x); if(!p.c.includes("未内置")) txt+=`  · ${p.l}${p.a}：${p.c}\n`; else txt+=`  · ${x}\n`; }); txt+="\n"; }
    
    txt+="【裁量标准】\n"; s.d.forEach(x=>{ let st=DS[x]; if(st){ txt+=`  ◆ ${st.n}\n`; st.c.forEach(cc=>{ txt+=`    ● ${cc.t}\n`; cc.i.forEach(ii=>{ txt+=`      - 情形：${ii.s} -> ${ii.st}\n`; }); }); } });
    updateResult(txt);
}

function searchAll() {
    const kw = document.getElementById('keywordInput').value.trim(); if(!kw) return;
    let res = [];
    for(const k in LP){ if(k.includes(kw) || LP[k].c.includes(kw)) res.push(`📄【内置法条】${LP[k].l}${LP[k].a}\n${LP[k].c}\n`); }
    
    CSV_DATA.forEach(r=>{
        if(r.name.includes(kw) || r.no.includes(kw) || r.body.includes(kw)){
            let t=`${r.id?'序号：'+r.id+'　':''}${r.name?'名称：'+r.name+'　':''}${r.no?'文号：'+r.no+'　':''}${r.date?'发布日期：'+r.date+'\n':''}${r.url?'网址：'+r.url+'\n':''}`;
            if(r.body.includes(kw)){ 
                const reg=new RegExp(`[^。！？；\\n]*${kw}[^。！？；\\n]*[。！？；]?`,'g'); 
                let m; 
                while((m=reg.exec(r.body))!==null) t+=`  ${m[0].trim()}\n`; 
            }
            res.push(t+'\n');
        }
    });
    
    if(!res.length) {
        if (CSV_DATA.length === 0) {
            return updateResult(`❌ 未找到，且当前 CSV 数据为空。\n请确认你是否已经把 laws.csv 上传到了该 GitHub 仓库的根目录。`);
        }
        return updateResult(`未找到包含「${kw}」的内容。`);
    }
    updateResult(`【搜索关键词】${kw} (共匹配 ${res.length} 条)\n\n`+res.slice(0,50).join('\n'), kw);
}

function updateResult(txt, kw="") {
    currentRaw = txt;
    let h = txt.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    if(kw){ const r = new RegExp(kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'); h = h.replace(r, m=>`<mark>${m}</mark>`); }
    const b = document.getElementById('resultBox'); b.innerHTML = h; b.scrollTop = 0;
}

function copyResult() {
    if(!currentRaw) return;
    navigator.clipboard.writeText(currentRaw).then(()=>{ alert("✅ 已复制！可直接粘贴。"); }).catch(()=>{ alert("请长按文本手动复制。"); });
}

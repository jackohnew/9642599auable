"土地管理法第65条":{l:"《中华人民共和国土地管理法》",a:"第六十五条",c:"在土地利用总体规划制定前已建的不符合土地利用总体规划确定的用途的建筑物、构筑物，不得重建、扩建。"},
"土地管理法第57条":{l:"《中华人民共和国土地管理法》",a:"第五十七条",c:"建设项目施工和地质勘查需要临时使用国有土地或者农民集体所有的土地的，由县级以上人民政府自然资源主管部门批准。临时使用土地的使用者应当按照临时使用土地合同约定的用途使用土地，并不得修建永久性建筑物。临时使用土地期限一般不超过二年。"},
"土地管理法第76条":{l:"《中华人民共和国土地管理法》",a:"第七十六条",c:"违反本法规定，拒不履行土地复垦义务的，由县级以上人民政府自然资源主管部门责令限期改正；逾期不改正的，责令缴纳复垦费，专项用于土地复垦，可以处以罚款。"},
"土地管理法第56条":{l:"《中华人民共和国土地管理法》",a:"第五十六条",c:"（内容详见法规原文，可从CSV检索）"},
"土地管理法第58条":{l:"《中华人民共和国土地管理法》",a:"第五十八条",c:"（内容详见法规原文，可从CSV检索）"},
"土地管理法第63条":{l:"《中华人民共和国土地管理法》",a:"第六十三条",c:"（内容详见法规原文，可从CSV检索）"},
"土地管理法第82条":{l:"《中华人民共和国土地管理法》",a:"第八十二条",c:"（内容详见法规原文，可从CSV检索）"},
"土地管理法第43条":{l:"《中华人民共和国土地管理法》",a:"第四十三条",c:"（内容详见法规原文，可从CSV检索）"},
"土地管理法实施条例第52条":{l:"《中华人民共和国土地管理法实施条例》",a:"第五十二条",c:"违反《土地管理法》第五十七条的规定，在临时使用的土地上修建永久性建筑物的，由县级以上人民政府自然资源主管部门责令限期拆除，按占用面积处土地复垦费5倍以上10倍以下的罚款；逾期不拆除的，由作出行政决定的机关依法申请人民法院强制执行。"},

"行政强制法第35条":{l:"《中华人民共和国行政强制法》",a:"第三十五条",c:"行政机关作出强制执行决定前，应当事先催告当事人履行义务。催告应当以书面形式作出，并载明下列事项：（一）履行义务的期限；（二）履行义务的方式；（三）涉及金钱给付的，应当有明确的金额和给付方式；（四）当事人依法享有的陈述权和申辩权。"},
"行政强制法第37条":{l:"《中华人民共和国行政强制法》",a:"第三十七条",c:"经催告，当事人逾期仍不履行行政决定，且无正当理由的，行政机关可以作出强制执行决定。强制执行决定应当以书面形式作出，并载明下列事项：（一）当事人的姓名或者名称、地址；（二）强制执行的理由和依据；（三）强制执行的方式和时间；（四）申请行政复议或者提起行政诉讼的途径和期限；（五）行政机关的名称、印章和日期。"},
"行政强制法第50条":{l:"《中华人民共和国行政强制法》",a:"第五十条",c:"行政机关依法作出要求当事人履行排除妨碍、恢复原状等义务的行政决定，当事人逾期不履行，经催告仍不履行，其后果已经或者将危害交通安全、造成环境污染或者破坏自然资源的，行政机关可以代履行，或者委托没有利害关系的第三人代履行。"},
"行政强制法第51条":{l:"《中华人民共和国行政强制法》",a:"第五十一条",c:"代履行应当遵守下列规定：（一）代履行前送达决定书，代履行决定书应当载明当事人的姓名或者名称、地址，代履行的理由和依据、方式和时间、标的、费用预算以及代履行人；（二）代履行三日前，催告当事人履行，当事人履行的，停止代履行；（三）代履行时，作出决定的行政机关应当派员到场监督；（四）代履行完毕，行政机关到场监督的工作人员、代履行人和当事人或者见证人应当在执行文书上签名或者盖章。代履行的费用按照成本合理确定，由当事人承担。但是，法律另有规定的除外。代履行不得采用暴力、胁迫以及其他非法方式。"},
"行政强制法第52条":{l:"《中华人民共和国行政强制法》",a:"第五十二条",c:"需要立即清除道路、河道、航道或者公共场所的遗洒物、障碍物或者污染物，当事人不能清除的，行政机关可以决定立即实施代履行；当事人不在场的，行政机关应当在事后立即通知当事人，并依法作出处理。"},
"行政强制法第54条":{l:"《中华人民共和国行政强制法》",a:"第五十四条",c:"行政机关申请人民法院强制执行前，应当催告当事人履行义务。催告书送达十日后当事人仍未履行义务的，行政机关可以向所在地有管辖权的人民法院申请强制执行；执行对象是不动产的，向不动产所在地有管辖权的人民法院申请强制执行。"},
"行政强制法第28条":{l:"《中华人民共和国行政强制法》",a:"第二十八条",c:"有下列情形之一的，行政机关应当及时作出解除查封、扣押决定：（一）当事人没有违法行为；（二）查封、扣押的场所、设施或者财物与违法行为无关；（三）行政机关对违法行为已经作出处理决定，不再需要查封、扣押；（四）查封、扣押期限已经届满；（五）其他不再需要采取查封、扣押措施的情形。解除查封、扣押应当立即退还财物。"},
"行政强制法第45条":{l:"《中华人民共和国行政强制法》",a:"第四十五条",c:"行政机关依法作出金钱给付义务的行政决定，当事人逾期不履行的，行政机关可以依法加处罚款或者滞纳金。加处罚款或者滞纳金的标准应当告知当事人。加处罚款或者滞纳金的数额不得超出金钱给付义务的数额。"},
"行政处罚法第58条":{l:"《中华人民共和国行政处罚法》",a:"第五十八条",c:"有下列情形之一，在行政机关负责人作出行政处罚的决定之前，应当由从事行政处罚决定法制审核的人员进行法制审核；未经法制审核或者审核未通过的，不得作出决定：（一）涉及重大公共利益的；（二）直接关系当事人或者第三人重大权益，经过听证程序的；（三）案件情况疑难复杂、涉及多个法律关系的；（四）法律、法规规定应当进行法制审核的其他情形。"},
"行政处罚法第64条":{l:"《中华人民共和国行政处罚法》",a:"第六十四条",c:"听证应当依照以下程序组织：（一）当事人要求听证的，应当在行政机关告知后五日内提出；（二）行政机关应当在举行听证的七日前，通知当事人及有关人员听证的时间、地点；（三）除涉及国家秘密、商业秘密或者个人隐私依法予以保密外，听证公开举行；（四）听证由行政机关指定的非本案调查人员主持；当事人认为主持人与本案有直接利害关系的，有权申请回避；（五）当事人可以亲自参加听证，也可以委托一至二人代理；（六）当事人及其代理人无正当理由拒不出席听证或者未经许可中途退出听证的，视为放弃听证权利，行政机关终止听证；（七）举行听证时，调查人员提出当事人违法的事实、证据和行政处罚建议，当事人进行申辩和质证；（八）听证应当制作笔录。笔录应当交当事人或者其代理人核对无误后签字或者盖章。当事人或者其代理人拒绝签字或者盖章的，由听证主持人在笔录中注明。"},
"行政处罚法第61条":{l:"《中华人民共和国行政处罚法》",a:"第六十一条",c:"行政处罚决定书应当在宣告后当场交付当事人；当事人不在场的，行政机关应当在七日内依照《中华人民共和国民事诉讼法》的有关规定，将行政处罚决定书送达当事人。"},
"广东省听证办法第18条":{l:"《广东省行政处罚听证程序实施办法》",a:"第十八条",c:"当事人要求听证的，应当自收到听证告知书之日起5日内向行政机关提出。当事人以非书面形式提出听证要求的，应当将情况记入笔录。当事人以邮寄方式提出听证要求的，以寄出日期为准。当事人逾期未提出听证要求的，视为放弃听证权利。"},
"广东省听证办法第38条":{l:"《广东省行政处罚听证程序实施办法》",a:"第三十八条",c:"行政机关收到当事人听证申请到听证会结束，不得超过30日，延期听证、中止听证的时间不计入。听证时间不计入案件办理期限。"},
"广东省听证办法第42条":{l:"《广东省行政处罚听证程序实施办法》",a:"第四十二条",c:"本办法中“3日”“5日”“7日”的规定是指工作日，不含法定节假日。"},
"特区条例第19条":{l:"《深圳经济特区规划土地监察条例》",a:"第十九条",c:"规划违法行为和土地违法行为符合下列条件的，规划土地监察机构应当予以立案：（一）有证据证明违法行为已经发生；（二）依法应当追究行政法律责任；（三）属于规划土地监察机构管辖范围。符合立案条件的，应当自受理之日起十个工作日内立案。不符合立案条件的，不予立案，并将理由告知案件移送单位或者举报人。"},
"特区条例第27条":{l:"《深圳经济特区规划土地监察条例》",a:"第二十七条",c:"监察人员发现规划违法行为或者土地违法行为正在实施或者可能继续实施的，应当及时向当事人发出停止违法行为通知书。"},
"特区条例第28条":{l:"《深圳经济特区规划土地监察条例》",a:"第二十八条",c:"停止违法行为通知书已经送达而违法行为人继续抢建的，规划土地监察机构可以对抢建部分迳行拆除。"},
"特区条例第32条":{l:"《深圳经济特区规划土地监察条例》",a:"第三十二条",c:"规划土地监察机构对违法建筑物、构筑物、设施作出限期拆除的行政处罚决定后，应当依法送达并在三个工作日内将决定书内容予以公告。公告应当张贴在拟拆除违法建筑物、构筑物、设施的显著位置。"},
"特区条例第33条":{l:"《深圳经济特区规划土地监察条例》",a:"第三十三条",c:"规划土地监察机构送达有关法律文书，应当直接送达。受送达人拒绝签收的，送达人可以邀请有关基层组织或者受送达人所在单位的代表到场，说明情况，在送达回证上记明拒收事由和日期，由送达人、见证人签名或者盖章，将文书留在当事人的收发部门或者住所，即视为送达。对有关违法建筑物、构筑物、设施的法律文书，采用直接送达、留置送达、邮寄送达等方式无法送达的，张贴在违法建筑物、构筑物、设施的显著位置；仍无法送达的，经本机构负责人批准，在本市主要报刊上公告送达，自公告发布之日起满三十日，即视为送达。"},
"特区条例第34条":{l:"《深圳经济特区规划土地监察条例》",a:"第三十四条",c:"违法案件的调查处理，应当自立案之日起三个月内完成。因特殊情况不能完成的，经本级规划土地监察机构负责人批准，可以适当延长，但是每次延长的期限不得超过一个月。规划土地监察机构应当在批准延期后将延期事项告知当事人或者利害关系人。"},
"特区条例第35条":{l:"《深圳经济特区规划土地监察条例》",a:"第三十五条",c:"对未经批准或者未按照批准内容进行建设的临时建筑物、构筑物、设施以及超过批准期限未拆除的临时建筑物、构筑物、设施，由规划土地监察机构责令限期拆除。当事人逾期不拆除的，由违法临时建筑物、构筑物、设施所在区的规划土地监察机构予以拆除。"},
"特区条例第37条":{l:"《深圳经济特区规划土地监察条例》",a:"第三十七条",c:"违法加建、改建的当事人以拒绝入户等方式阻碍监察人员进行现场检查、勘验等执法活动的，处五万元罚款。"},
"特区条例第38条":{l:"《深圳经济特区规划土地监察条例》",a:"第三十八条",c:"规划土地监察机构在履行监察职责时，发现向违反城市规划或者土地管理法律、法规、规章的建设工程供水、供电或者出售预拌混凝土的，应当书面通知实施上述行为的单位或者个人停止供水、供电或者出售预拌混凝土。单位或者个人收到通知后未按照要求配合执法的，处每场所五万元罚款。"},
"刑法第342条":{l:"《中华人民共和国刑法》",a:"第三百四十二条",c:"违反土地管理法规，非法占用耕地、林地等农用地，改变被占用土地用途，数量较大，造成耕地、林地等农用地大量毁坏的，处五年以下有期徒刑或者拘役，并处或者单处罚金。"},
"刑法第228条":{l:"《中华人民共和国刑法》",a:"第二百二十八条",c:"以牟利为目的，违反土地管理法规，非法转让、倒卖土地使用权，情节严重的，处三年以下有期徒刑或者拘役，并处或者单处非法转让、倒卖土地使用权价额百分之五以上百分之二十以下罚金；情节特别严重的，处三年以上七年以下有期徒刑，并处非法转让、倒卖土地使用权价额百分之五以上百分之二十以下罚金。"},
"行政复议法第20条":{l:"《中华人民共和国行政复议法》",a:"第二十条",c:"公民、法人或者其他组织认为行政行为侵犯其合法权益的，可以自知道或者应当知道该行政行为之日起六十日内提出行政复议申请；但是法律规定的申请期限超过六十日的除外。"},
"行政诉讼法第46条":{l:"《中华人民共和国行政诉讼法》",a:"第四十六条",c:"公民、法人或者其他组织直接向人民法院提起诉讼的，应当自知道或者应当知道作出行政行为之日起六个月内提出。法律另有规定的除外。"},
"行政诉讼法第97条":{l:"《中华人民共和国行政诉讼法》",a:"第九十七条",c:"公民、法人或者其他组织对行政行为在法定期限内不提起诉讼又不履行的，行政机关可以申请人民法院强制执行，或者依法强制执行。"},
"深圳临时用地办法第20条":{l:"《深圳市临时用地管理办法》",a:"第二十条",c:"临时用地使用期限届满前二个月，主管部门应当书面通知用地单位按期交还土地；用地单位应当按期拆除地上建（构）筑物，恢复土地原状，交还土地。"},
"深圳临时用地办法第24条":{l:"《深圳市临时用地管理办法》",a:"第二十四条",c:"临时用地使用期限届满，用地单位拒不交还土地的，主管部门可以将该临时用地执法收回事项移交所在街道办事处，由街道办事处按照违法用地、违法建筑相关规定予以执法收回。"},

const DEF_SECTIONS = {
"协助调查通知依据": ["行政处罚法第54条", "行政处罚法第55条", "特区条例第24条"],
"听证依据": ["行政处罚法第63条", "广东省听证办法第6条", "广东省听证办法第7条"],
"申诉依据": ["行政处罚法第44条", "行政处罚法第45条"],
"查封依据": ["行政强制法第22条", "行政强制法第24条", "特区条例第40条"],
"延长查封期限依据": ["行政强制法第25条", "特区条例第43条"],
"限制房产权利依据": ["特区条例第39条"],
"解除房产权利依据": ["特区条例第39条"],
"强制执行依据": ["行政强制法第44条", "行政强制法第53条", "特区条例第44条"]
};

const NO_SEIZURE = ["4-2","4-5","4-7","4-8","4-9","4-11","4-12","4-13","4-15","4-17","4-18","4-19"];
const NO_PROP = ["4-2","4-5","4-7","4-8","4-9","4-10","4-11","4-12","4-13","4-15","4-17","4-18","4-19"];

let CSV_DATA = [], currentRaw = "", CSV_HEADERS = [], CSV_TEXT_COL = "";

window.onload = function() {
    const s = document.getElementById('situationSelect');
    for(const k in SIT) { let o = document.createElement('option'); o.value=k; o.text=k+" | "+SIT[k].n.substring(0,15)+"..."; s.appendChild(o); }

    if (window.location.protocol === 'file:') return updateResult("⚠️ 请勿双击本地打开，请通过网址访问。");
    fetch('laws.csv?t=' + new Date().getTime()).then(r => r.ok ? r.arrayBuffer() : Promise.reject('未找到 laws.csv')).then(b => {
        let t; try { t = new TextDecoder('utf-8', { fatal: true }).decode(b); } catch(e) { t = new TextDecoder('gbk').decode(b); }
        if (t.includes('\ufffd')) t = new TextDecoder('gbk').decode(b);
        const count = parseCSV(t);
        updateResult(count > 0 ? `✅ 初始化完成，已加载 ${count} 条CSV政策法规数据。` : `⚠️ CSV解析为0条，请检查表头。`);
    }).catch(e => updateResult(`⚠️ ${e}\n你仍可使用内置法条查询。`));
};

function parseCSV(text) {
    let result = [], row = [], current = '', inQuotes = false;
    for (let i = 0; i < text.length; i++) {
        const char = text[i], nextChar = text[i + 1];
        if (inQuotes) {
            if (char === '"') { if (nextChar === '"') { current += '"'; i++; } else { inQuotes = false; } } else { current += char; }
        } else {
            if (char === '"') { inQuotes = true; }
            else if (char === ',') { row.push(current); current = ''; }
            else if (char === '\n' || char === '\r') { row.push(current); current = ''; if (row.length > 1 || row[0] !== '') result.push(row); row = []; if (char === '\r' && nextChar === '\n') i++; } else { current += char; }
        }
    }
    if (current !== '' || row.length > 0) { row.push(current); result.push(row); }
    if (result.length < 2) return 0;

    CSV_HEADERS = result[0].map(h => h.replace(/^\ufeff/,'').trim().replace(/[\r\n]/g, ''));
    CSV_TEXT_COL = CSV_HEADERS.find(h => /正文|内容|全文/.test(h)) || "";
    let count = 0;
    for (let i = 1; i < result.length; i++) {
        const cols = result[i]; if (!cols || cols.length === 0) continue;
        let rowObj = {}; let hasData = false;
        for (let j = 0; j < CSV_HEADERS.length; j++) {
            let val = cols[j] ? cols[j].replace(/<[^>]+>/g,'').trim() : '';
            if (val) hasData = true;
            rowObj[CSV_HEADERS[j]] = val;
        }
        if (hasData) { CSV_DATA.push(rowObj); count++; }
    }
    return count;
}

function getP(k){ return LP[k] || {l:k, a:"", c:"（该法规原文未内置，请使用上方搜索框检索政策库）"}; }

function splitIntoSegments(text) {
    if (!text) return [];
    const regex = /第[零一二三四五六七八九十百千万\d]+条/g;
    let match, starts = [];
    while ((match = regex.exec(text)) !== null) {
        starts.push(match.index);
    }
    if (starts.length === 0) return [text];

    let segments = [];
    if (starts[0] > 0) segments.push(text.substring(0, starts[0]));
    for (let i = 0; i < starts.length; i++) {
        let end = i + 1 < starts.length ? starts[i + 1] : text.length;
        segments.push(text.substring(starts[i], end));
    }
    return segments;
}

function extractContextBlocks(text, kw) {
    let blocks = [];
    let segs = splitIntoSegments(text);
    for (let seg of segs) {
        if (seg.includes(kw)) blocks.push(seg.trim());
    }
    if (blocks.length === 0) {
        let parts = text.split(/[。！？；\n]/);
        for (let p of parts) {
            if (p.includes(kw)) blocks.push(p.trim());
        }
    }
    return blocks;
}

// 新增：按 py 版逻辑提取包含任一关键词的上下文片段，用于 CSV 正文列
function extractCsvBlocks(text, kws) {
    if (!text) return [];
    kws = (Array.isArray(kws) ? kws : [kws]).filter(Boolean);
    if (!kws.length) return [];

    const parts = text.split(/(。|！|？|；|\n)/);
    let sentences = [];
    for (let i = 0; i < parts.length; i++) {
        if (i + 1 < parts.length && '。！？；\n'.includes(parts[i + 1])) {
            sentences.push((parts[i] + parts[i + 1]).trim());
            i++;
        } else if (parts[i].trim()) {
            sentences.push(parts[i].trim());
        }
    }

    let blocks = [];
    for (let i = 0; i < sentences.length && blocks.length < 20; i++) {
        if (kws.some(kw => sentences[i].includes(kw))) {
            let block = sentences[i];
            if (/[：:]$/.test(block.trim())) {
                let j = i + 1;
                while (j < sentences.length && !/第[零一二三四五六七八九十百\d]+条/.test(sentences[j]) && block.length < 3000) {
                    block += sentences[j];
                    j++;
                }
            }
            blocks.push(block.trim());
        }
    }

    if (!blocks.length) {
        splitIntoSegments(text).forEach(seg => {
            if (kws.some(kw => seg.includes(kw))) blocks.push(seg.trim());
        });
    }
    return blocks.slice(0, 20);
}

// 查询情形，输出 CSV 详表与裁量基准
function querySituation() {
    const k = document.getElementById('situationSelect').value; if(!k) return updateResult("请选择执法事项");
    const s = SIT[k];
    let txt = `【情形编号】${k}\n【情形名称】${s.n}\n【所属分类】${s.t}\n【过渡期建议】${s.tr}\n\n`;

    if(s.es.a){ txt+="【公告调查依据】\n"; s.es.a.forEach(x=>{ if(x.startsWith("（")) txt+=`  ${x}\n`; else { let p=getP(x); txt+=`  · ${p.l}${p.a}：${p.c}\n`; }}); txt+="\n"; }
    txt+="【协助调查通知依据】\n"; DEF_SECTIONS["协助调查通知依据"].forEach(x=>{ let p=getP(x); txt+=`  · ${p.l}${p.a}：${p.c}\n`; }); txt+="\n";
    txt+="【处罚理由】\n"; s.ls.r.forEach(x=>{ if(x.startsWith("（")) txt+=`  ${x}\n`; else { let p=getP(x); txt+=`  · ${p.l}${p.a}：${p.c}\n`; }}); txt+="\n";
    txt+="【处罚依据】\n"; s.ls.p.forEach(x=>{ let p=getP(x); txt+=`  · ${p.l}${p.a}：${p.c}\n`; }); txt+="\n";

    txt+="【听证依据】\n"; DEF_SECTIONS["听证依据"].forEach(x=>{ let p=getP(x); txt+=`  · ${p.l}${p.a}：${p.c}\n`; }); txt+="\n";
    txt+="【申诉依据】\n"; DEF_SECTIONS["申诉依据"].forEach(x=>{ let p=getP(x); txt+=`  · ${p.l}${p.a}：${p.c}\n`; }); txt+="\n";

    if(!NO_SEIZURE.includes(k)) {
        txt+="【查封依据】\n"; DEF_SECTIONS["查封依据"].forEach(x=>{ let p=getP(x); txt+=`  · ${p.l}${p.a}：${p.c}\n`; }); txt+="\n";
        txt+="【延长查封期限依据】\n"; DEF_SECTIONS["延长查封期限依据"].forEach(x=>{ let p=getP(x); txt+=`  · ${p.l}${p.a}：${p.c}\n`; }); txt+="\n";
    }

    if(!NO_PROP.includes(k)) {
        txt+="【限制房产权利依据】\n"; DEF_SECTIONS["限制房产权利依据"].forEach(x=>{ let p=getP(x); txt+=`  · ${p.l}${p.a}：${p.c}\n`; }); txt+="\n";
        txt+="【解除房产权利依据】\n"; DEF_SECTIONS["解除房产权利依据"].forEach(x=>{ let p=getP(x); txt+=`  · ${p.l}${p.a}：${p.c}\n`; }); txt+="\n";
    }

    txt+="【强制执行依据】\n"; DEF_SECTIONS["强制执行依据"].forEach(x=>{ let p=getP(x); txt+=`  · ${p.l}${p.a}：${p.c}\n`; }); txt+="\n";

    if(s.es.m){ txt+="【移送依据】\n"; s.es.m.forEach(x=>{ let p=getP(x); if(!p.c.includes("未内置")) txt+=`  · ${p.l}${p.a}：${p.c}\n`; else txt+=`  · ${x}\n`; }); txt+="\n"; }

    // 【CSV 政策库匹配：不再强制要求“裁量档次/裁量基准”，优先裁量行但允许正文命中】
    let matchKws = [];
    if (s.n.includes("装饰装修")) matchKws = ["装饰装修", "外立面", "搭建", "开门", "开窗"];
    else if (s.n.includes("未取得") || s.n.includes("未按")) matchKws = ["未取得建设工程规划许可证", "未按照建设工程规划许可证", "未取得规划许可证", "未按规划许可证", "建设工程规划许可证"];
    else if (s.n.includes("非法占用")) matchKws = ["非法占用土地", "非法占用"];
    else if (s.n.includes("临时用地")) matchKws = ["临时用地"];
    else if (s.n.includes("复垦")) matchKws = ["复垦"];
    else matchKws = [s.n.substring(0, 6)];

    let csvHits = [];
    CSV_DATA.forEach(r => {
        let rowStr = Object.values(r).join("||");
        let hasKw = matchKws.some(kw => kw && rowStr.includes(kw));
        if (hasKw) {
            let isDiscretion = rowStr.includes("裁量") || rowStr.includes("档次") || rowStr.includes("基准") || CSV_HEADERS.some(h => /裁量|档次|基准/.test(h));
            csvHits.push({ r, isDiscretion, rowStr });
        }
    });

    // 去重 + 裁量行优先
    let seenCsv = new Set();
    csvHits = csvHits.filter(x => {
        if (seenCsv.has(x.rowStr)) return false;
        seenCsv.add(x.rowStr);
        return true;
    }).sort((a, b) => (b.isDiscretion ? 1 : 0) - (a.isDiscretion ? 1 : 0)).slice(0, 20);

    if (csvHits.length > 0) {
        txt += "\n【来自政策库的详尽裁量基准与情节】\n";
        csvHits.forEach((hit, idx) => {
            const r = hit.r;
            txt += `\n◆ 详细记录 ${idx + 1}\n`;
            const baseKeys = ["序号", "名称", "原名称", "来源", "发布日期", "文号", "发布机构", "网址"];
            baseKeys.forEach(key => { if (r[key]) txt += `${key}：${r[key]}\n`; });

            for (let key in r) {
                if (baseKeys.includes(key)) continue;
                let val = r[key];
                if (!val) continue;

                if (key === CSV_TEXT_COL || /正文|内容|全文/.test(key)) {
                    let blocks = extractCsvBlocks(val, matchKws);
                    if (blocks.length > 0) {
                        txt += `${key}：\n`;
                        blocks.forEach(b => { txt += `  ${b}\n`; });
                    } else {
                        txt += `${key}：${val}\n`;
                    }
                } else {
                    if (val.length > 20000) val = val.slice(0, 20000) + "……（超长截断）";
                    txt += `${key}：${val}\n`;
                }
            }
        });
    } else {
        txt += `\n【提示】未在 laws.csv 中找到与当前情形关键词匹配的政策库记录。当前关键词：${matchKws.join("、")}\n`;
    }

    updateResult(txt);
}

function searchAll() {
    const kw = document.getElementById('keywordInput').value.trim(); if(!kw) return;
    let res = [];

    // 优先搜 CSV（详表）
    CSV_DATA.forEach(r=>{
        let rowHit = false;
        let hitKeys = [];
        for(let k in r) {
            if(r[k] && r[k].includes(kw)) {
                rowHit = true;
                hitKeys.push(k);
            }
        }

        if(rowHit) {
            let text = "";
            if (r["序号"]) text += `序号：${r["序号"]}\n`;
            if (r["名称"]) text += `名称：${r["名称"]}\n`;
            if (r["发布日期"]) text += `发布日期：${r["发布日期"]}\n`;
            if (r["文号"]) text += `文号：${r["文号"]}\n`;
            if (r["网址"]) text += `网址：${r["网址"]}\n`;

            for(let k in r) {
                let val = r[k];
                if(!val || ["序号", "名称", "发布日期", "文号", "网址"].includes(k)) continue;

                if(hitKeys.includes(k) && val.length > 50) {
                    let blocks = extractContextBlocks(val, kw);
                    if(blocks.length > 0) {
                        text += `${k}：\n`;
                        blocks.forEach(b => { text += `  ${b}\n`; });
                    } else {
                        text += `${k}：${val}\n`;
                    }
                } else {
                    text += `${k}：${val}\n`;
                }
            }
            res.push(text + "\n");
        }
    });

    // 其次搜内置法条
    for(const k in LP){
        if(k.includes(kw) || LP[k].c.includes(kw)) {
            res.push(`📄【内置法条】${LP[k].l}${LP[k].a}\n${LP[k].c}\n`);
        }
    }

    if(!res.length) return updateResult(`未找到包含「${kw}」的内容。`);
    updateResult(`【搜索关键词】${kw} (共匹配 ${res.length} 条)\n\n`+res.slice(0, 50).join('\n'), kw);
}

function updateResult(txt, kw="") {
    currentRaw = txt;
    let h = txt.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    if(kw){ const r = new RegExp(kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'); h = h.replace(r, m=>`<mark>${m}</mark>`); }
    const b = document.getElementById('resultBox'); b.innerHTML = h; b.scrollTop = 0;
}

function copyResult() {
    if(!currentRaw) return;
    navigator.clipboard.writeText(currentRaw).then(()=>{ alert("✅ 已复制！可直接粘贴。"); }).catch(()=>{ alert("请长按文本手动复制。"); });
}
